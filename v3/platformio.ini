; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:nodemcu-32s]
platform = espressif32
board = nodemcu-32s
framework = arduino
monitor_speed = 115200

; OTA 專用分割表 (app0 / app1 雙分割區，支援 Over-The-Air 無線更新)
; 分割表檔案位於本專案根目錄 partitions.csv
board_build.partitions = partitions.csv

; PU2CLR RDA5807 已改為專案內 vendor 版 (lib/PU2CLR RDA5807)：
; 原廠 1.1.9 的 getStatusRegisters() 在 requestFrom() 後多呼叫一次
; Wire.endTransmission()，ESP32 core 3.x 會送出幽靈 I2C 寫入污染 SSD1306，
; 造成 OLED 左上角漸層掃描殘影。已於 vendor 版移除該多餘呼叫。
lib_deps =
  adafruit/Adafruit SSD1306@^2.5.17
  adafruit/Adafruit GFX Library @ ^1.12.6
  mathertel/OneButton @ ^2.6.2
  bblanchon/ArduinoJson @ ^7.4.3
